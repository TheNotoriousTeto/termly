<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Termly</title>
  <meta name="description" content="GPA calculator and weekly task manager for university students. Works offline; your data stays on your device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Installable, full-screen on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Termly">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="screen"></main>
    <nav class="tabbar" aria-label="Sections">
      <button type="button" class="tab" data-tab="gpa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2 1.6 8 12 12.8 22.4 8 12 3.2Z"/><path fill="currentColor" d="M5.6 11.1v4.3c0 1.9 2.9 3.6 6.4 3.6s6.4-1.7 6.4-3.6v-4.3L12 14.1l-6.4-3Z"/><path d="M20.4 9v6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="20.4" cy="15.9" r="1.2" fill="currentColor"/></svg>
        <span>GPA</span>
      </button>
      <button type="button" class="tab" data-tab="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="7" r="2.6" fill="currentColor" stroke="none"/><path class="tab-check" d="m3.9 7 .8.8 1.5-1.6" stroke-width="1.3"/><circle cx="5" cy="16.5" r="2.3" stroke-width="1.7"/><path d="M11 7h10M11 16.5h10"/></svg>
        <span>Tasks</span>
      </button>
    </nav>
  </div>
  <div id="overlays"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <noscript><p class="noscript">Termly needs JavaScript to run.</p></noscript>

  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
